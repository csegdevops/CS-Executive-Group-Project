<!--
Supabase Dashboard > Authentication > Email Templates > Invite user
Subject line to set there: You're invited — CS Executive Group Portal

Not currently triggered — the app's own "Invite User" admin flow
(POST /api/users) and the timesheets contractor/supervisor provisioning
flow both use admin.createUser() + resetPasswordForEmail() instead of
Supabase's inviteUserByEmail(), so they fire the "Reset Password" template
below, not this one. Kept configured/ready in case a call site switches to
the real inviteUserByEmail() API later — the link below already matches
what /reset-password expects for type=invite (see that page's useEffect).
-->
<!DOCTYPE html><html dir="ltr" lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="x-apple-disable-message-reformatting"/></head><body style="margin:0;padding:24px 12px;background:#f4f3ef;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center"><table role="presentation" width="100%" style="max-width:560px" cellpadding="0" cellspacing="0"><tr><td style="background:#ffffff;border:1px solid #e9e6dd;border-radius:12px;padding:32px"><table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center" style="padding-bottom:20px;border-bottom:1px solid #e9e6dd"><img src="https://portal.csexecutivegroup.com/cseg_logo_new.png" alt="CS Executive Group" height="36" style="height:36px;width:auto;display:block"/></td></tr><tr><td style="padding-top:24px"><h1 style="margin:0 0 16px;font-size:20px;line-height:28px;color:#2b2b2b;font-weight:700">You're invited</h1></td></tr><tr><td style="padding-bottom:16px"><p style="margin:0;font-size:14px;line-height:22px;color:#3f3f3f">You've been invited to the CS Executive Group Portal as <strong>{{ .Email }}</strong>. Set a password to activate your account.</p></td></tr><tr><td align="center" style="padding-top:24px"><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=invite" style="display:inline-block;background:#a4915f;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;padding:12px 28px;border-radius:6px" target="_blank">Set your password</a></td></tr><tr><td style="padding-top:20px"><p style="margin:0;font-size:12px;line-height:18px;color:#8a8a8a">If you weren't expecting this invite, you can safely ignore this email.</p></td></tr></table></td></tr></table></td></tr></table></body></html>
